<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AIHS Digital Library Admin</title>

<link rel="stylesheet" href="styles.css">

</head>


<body>


<header>

<div class="brand">

<img src="logo.jpg">

<div>

<strong>
AIHS Digital Library
</strong>

<small>
Acharya Institute of Health Sciences
</small>

</div>

</div>


<div class="userbar">

<span id="adminInfo">
admin • Librarian
</span>

<button onclick="logoutAdmin()">
Logout
</button>


</div>

</header>



<main>


<section class="hero">


<h1>
Welcome to AIHS Digital Library
</h1>


<p>
Admin Dashboard
</p>



<input 
id="adminSearch"
placeholder="🔍 Search anything... (Book, User, Journal, Event)"
>


</section>





<section class="admin-dashboard">


<div class="admin-card"
onclick="openAdministration()">

<h2>
📚 Library Administration
</h2>

<p>
Manage Library Collections and Users
</p>


</div>




<div class="admin-card"
onclick="openEvents()">


<h2>
🎉 Library Events
</h2>


<p>
Add and manage library events
</p>


</div>



</section>



</main>





<script src="admin.js"></script>


</body>

</html>
