<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
AIHS E-Book Collection
</title>

<link rel="stylesheet" href="styles.css">

</head>


<body>


<header>

<div class="brand">

<img src="logo.jpg">

<div>
<strong>
AIHS Digital Library
</strong>

<small>
Acharya Institute of Health Sciences
</small>

</div>

</div>


<div class="userbar">

<span>
admin • Librarian
</span>

<button onclick="backCollections()">
⬅ Back
</button>

</div>


</header>



<main>


<section class="hero">

<h1>
📚 E-Book Collection
</h1>

<p>
Manage Digital Books - Upload, Edit and Delete
</p>

</section>



<section class="admin-box upload-box">


<h2>
📤 Upload New E-Book
</h2>


<input id="title"
placeholder="Book Title">


<input id="subject"
placeholder="Subject">


<select id="department">

<option value="">
Select Department
</option>

<option>BPT</option>
<option>BMLT</option>
<option>BMIT</option>
<option>MPT</option>
<option>MHA</option>
<option>ATOT</option>

</select>



<select id="year">

<option value="">
Select Year
</option>

<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>

</select>



<input id="file"
type="file">



<button class="primary"
onclick="uploadEbook()">

📤 Upload E-Book

</button>


<div id="msg"></div>


</section>




<section class="admin-box">


<h2>
📖 Available E-Books
</h2>


<input id="searchBook"
placeholder="🔍 Search E-Books..."
onkeyup="searchBooks()">



<div id="ebookList">

Loading...

</div>


</section>



</main>



<script src="ebooks.js"></script>


</body>

</html>
