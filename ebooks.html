<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AIHS E-Book Collection</title>

<link rel="stylesheet" href="styles.css">

</head>


<body>


<!-- ===============================
     HEADER
     =============================== -->

<header>

    <div class="brand">

        <img src="logo.jpg" alt="AIHS Logo">

        <div>

            <strong>
                AIHS Digital Library
            </strong>

            <small>
                Acharya Institute of Health Sciences
            </small>

        </div>

    </div>


    <div class="userbar">

        <span id="userInfo">
            Loading...
        </span>

        <button onclick="backToDashboard()">
            ⬅ Back
        </button>

        <button onclick="logoutUser()">
            Logout
        </button>

    </div>

</header>



<!-- ===============================
     MAIN
     =============================== -->

<main>


    <!-- PAGE TITLE -->

    <section class="hero">

        <h1>
            📚 E-Book Collection
        </h1>

        <p id="pageDescription">
            Loading...
        </p>

    </section>



    <!-- ===============================
         LIBRARIAN UPLOAD SECTION
         =============================== -->

    <section
        id="uploadSection"
        class="admin-box upload-box"
        style="display:none;"
    >

        <h2>
            📤 Upload New E-Book
        </h2>


        <input
            id="title"
            type="text"
            placeholder="Book Title"
        >


        <input
            id="subject"
            type="text"
            placeholder="Subject"
        >


        <select id="department">

            <option value="">
                Select Department
            </option>

            <option value="BPT">
                BPT
            </option>

            <option value="BMLT">
                BMLT
            </option>

            <option value="BMIT">
                BMIT
            </option>

            <option value="MPT">
                MPT
            </option>

            <option value="MHA">
                MHA
            </option>

            <option value="ATOT">
                ATOT
            </option>

        </select>


        <select id="year">

            <option value="">
                Select Year
            </option>

            <option value="1st Year">
                1st Year
            </option>

            <option value="2nd Year">
                2nd Year
            </option>

            <option value="3rd Year">
                3rd Year
            </option>

            <option value="4th Year">
                4th Year
            </option>

        </select>


        <input
            id="file"
            type="file"
            accept="application/pdf,.pdf"
        >


        <button
            class="primary"
            type="button"
            onclick="uploadEbook()"
        >
            📤 Upload E-Book
        </button>


        <div id="msg"></div>

    </section>



    <!-- ===============================
         E-BOOK LIST
         =============================== -->

    <section class="admin-box">

        <h2>
            📖 Available E-Books
        </h2>


        <!-- SEARCH -->

        <input
            id="searchBook"
            type="text"
            placeholder="🔍 Search E-Books by title, subject, department or year..."
            oninput="searchBooks()"
        >


        <!-- RESOURCE LIST -->

        <div id="ebookList">

            Loading...

        </div>

    </section>


</main>



<!-- ===============================
     JAVASCRIPT
     =============================== -->

<script src="ebooks.js"></script>


<script>

/* =================================
   PAGE INITIALIZATION
   ================================= */

document.addEventListener("DOMContentLoaded", function(){

    const user =
        localStorage.getItem("user");

    const role =
        localStorage.getItem("role");


    /* ===============================
       USER INFORMATION
       =============================== */

    const userInfo =
        document.getElementById("userInfo");

    if(userInfo){

        userInfo.textContent =
            (user || "User") +
            " • " +
            (role || "User");

    }


    /* ===============================
       PAGE DESCRIPTION
       =============================== */

    const description =
        document.getElementById("pageDescription");


    if(role === "Librarian"){

        const uploadSection =
            document.getElementById("uploadSection");

        if(uploadSection){

            uploadSection.style.display =
                "block";

        }


        if(description){

            description.textContent =
                "Manage Digital Books - Upload, Edit and Delete";

        }

    }
    else{

        if(description){

            description.textContent =
                "Browse and Read Digital Books";

        }

    }

});


/* =================================
   BACK
   ================================= */

function backToDashboard(){

    const role =
        localStorage.getItem("role");


    /* LIBRARIAN */

    if(role === "Librarian"){

        window.location.href =
            "administration.html";

        return;

    }


    /* STUDENT / STAFF */

    if(role === "Student" || role === "Staff"){

        window.location.href =
            "index.html?dashboard=1";

        return;

    }


    /* NOT LOGGED IN */

    window.location.href =
        "index.html";

}


/* =================================
   LOGOUT
   ================================= */

function logoutUser(){

    localStorage.removeItem("user");

    localStorage.removeItem("token");

    localStorage.removeItem("role");

    window.location.href =
        "index.html";

}

</script>


</body>

</html>
