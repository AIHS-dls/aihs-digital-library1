<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AIHS E-Books Administration</title>

<link rel="stylesheet" href="styles.css">

</head>


<body>


<header>

<div class="brand">

<img src="logo.jpg" alt="AIHS Logo">

<div>

<strong>
AIHS Digital Library
</strong>

<small>
Acharya Institute of Health Sciences
</small>

</div>

</div>


<div class="userbar">

<span>
admin • Librarian
</span>

<button onclick="backAdministration()">
⬅ Back
</button>

</div>

</header>



<main>


<section class="hero">

<h1>
📚 E-Books Administration
</h1>

<p>
Upload, Edit and Delete E-Books
</p>

</section>



<section class="admin-box">

<h2>
📤 Add E-Book
</h2>


<input
id="title"
placeholder="E-Book Title"
>


<select id="department">

<option value="">
Select Department
</option>

<option>BPT</option>
<option>BMLT</option>
<option>BMIT</option>
<option>MPT</option>
<option>MHA</option>

</select>



<select id="year">

<option value="">
Select Year
</option>

<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>

</select>



<input
id="subject"
placeholder="Subject"
>


<input
id="file"
type="file"
accept=".pdf"
>


<button
class="primary upload-btn"
onclick="uploadEbook()"
>

📤 Upload E-Book

</button>


<div id="msg"></div>

</section>



<section class="admin-box">

<h2>
📖 E-Book Collection
</h2>


<div id="resourceList">

Loading E-Books...

</div>


</section>


</main>



<script src="ebooks-admin.js"></script>

</body>

</html>
