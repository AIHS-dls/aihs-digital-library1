<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Library Collections
</title>

<link rel="stylesheet" href="styles.css">

</head>


<body>


<header>

<div class="brand">

<img src="logo.jpg">

<div>

<strong>
AIHS Digital Library
</strong>

<small>
Acharya Institute of Health Sciences
</small>

</div>

</div>


<div class="userbar">

<span>
admin • Librarian
</span>

<button onclick="backAdmin()">
⬅ Back
</button>

</div>


</header>





<main>


<section class="hero">


<h1>
📚 Library Collections
</h1>


<p>
Manage E-Books, Notes, Question Papers and Journals
</p>


</section>





<section class="admin-box">


<h2>
📤 Add Resource
</h2>



<input 
id="title"
placeholder="Resource Title"
>



<select id="type">

<option>
E-book
</option>

<option>
Question Paper
</option>

<option>
Notes
</option>

<option>
Journal
</option>

<option>
Database
</option>

</select>




<select id="department">


<option value="">
Select Department
</option>

<option>
BPT
</option>

<option>
BMLT
</option>

<option>
BMIT
</option>

<option>
MPT
</option>

<option>
MHA
</option>


</select>





<select id="year">


<option value="">
Select Year
</option>

<option>
1st Year
</option>

<option>
2nd Year
</option>

<option>
3rd Year
</option>

<option>
4th Year
</option>


</select>





<input 
id="subject"
placeholder="Subject"
>




<input 
id="file"
type="file"
>




<button class="primary"
onclick="uploadResource()">

Upload Resource

</button>



<div id="msg"></div>



</section>








<section class="admin-box">


<h2>
📖 Uploaded Resources
</h2>


<div id="resourceList">

Loading...

</div>



</section>




</main>





<script src="collections.js"></script>



</body>

</html>
